name: Prepare or test a downstream project

on:
  workflow_call:
    inputs:
      side:
        type: string
        required: true
      commit:
        type: string
        required: true
      platform:
        type: string
        required: true
      runner:
        type: string
        required: true
      mode:
        type: string
        required: true
      project:
        type: string
        required: true
      operation:
        type: string
        required: true

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  project:
    name: ${{ inputs.project }} (${{ inputs.side }}, ${{ inputs.operation }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.4'
          python-version: '3.14'
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cpython-${{ inputs.side }}-${{ inputs.platform }}-${{ inputs.mode }}
          path: cpython-artifact
      - if: inputs.operation == 'build' && inputs.side == 'target'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: build-report-baseline-${{ inputs.platform }}-${{ inputs.mode }}-${{ inputs.project }}
          path: baseline-package
      - if: inputs.operation == 'test'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: prepared-${{ inputs.side }}-${{ inputs.platform }}-${{ inputs.mode }}-*
          path: prepared-packages
      - name: Prepare or test project
        # Package failures are data. The final comparison decides whether this
        # workflow regresses main; missing reports remain infrastructure errors.
        continue-on-error: true
        env:
          CPYTHON_COMMIT: ${{ inputs.commit }}
          PLATFORM: ${{ inputs.platform }}
          MODE: ${{ inputs.mode }}
          PROJECT: ${{ inputs.project }}
          OPERATION: ${{ inputs.operation }}
          SIDE: ${{ inputs.side }}
        shell: bash
        run: |
          options=()
          if [[ "$OPERATION" == build ]]; then
            options+=(--build-only)
            if [[ "$SIDE" == target ]]; then
              options+=(--baseline-root baseline-package)
            fi
          else
            options+=(--prepared-root prepared-packages)
          fi
          uv run --locked --no-dev python -m snake_pit.project --commit "$CPYTHON_COMMIT" --platform "$PLATFORM" --mode "$MODE" --project "$PROJECT" "${options[@]}"
      - if: always() && inputs.operation == 'build'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-report-${{ inputs.side }}-${{ inputs.platform }}-${{ inputs.mode }}-${{ inputs.project }}
          path: |
            results/result.json
            results/pylock*.toml
          if-no-files-found: warn
          retention-days: 7
      - if: always() && inputs.operation == 'build'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepared-${{ inputs.side }}-${{ inputs.platform }}-${{ inputs.mode }}-${{ inputs.project }}
          path: |
            results/result.json
            results/pylock*.toml
            results/wheels/
          if-no-files-found: warn
          retention-days: 7
      - if: always() && inputs.operation == 'test'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: outcome-${{ inputs.side }}-${{ inputs.platform }}-${{ inputs.mode }}-${{ inputs.project }}
          path: |
            results/result.json
            results/tests.xml
          if-no-files-found: warn
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-${{ inputs.operation }}-${{ inputs.side }}-${{ inputs.platform }}-${{ inputs.mode }}-${{ inputs.project }}
          path: results/
          if-no-files-found: warn
          retention-days: 7
